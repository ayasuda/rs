<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>Frontend API Test</h1>
    <button onclick="testAPI()">Test Ingredients API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            try {
                const response = await fetch('http://localhost:8080/master/ingredients');
                const data = await response.json();
                
                document.getElementById('result').innerHTML = 
                    `<h2>Success! Loaded ${data.length} ingredients:</h2>
                     <pre>${JSON.stringify(data.slice(0, 5), null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<h2>Error:</h2><p>${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
